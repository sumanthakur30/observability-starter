# Imported by services that add the starter. Override per environment.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.tracing.propagation.type=W3C
management.tracing.sampling.probability=${OTEL_TRACES_SAMPLER_ARG:1.0}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318}/v1/traces}
# Fail-open: missing collector must not block requests.
management.otlp.metrics.export.enabled=${SUGAM_OTEL_METRICS:false}
sugam.observability.enabled=${SUGAM_OBSERVABILITY_ENABLED:true}
sugam.observability.tenant-context-enabled=${SUGAM_TENANT_CONTEXT_ENABLED:true}
sugam.observability.json-logs=${SUGAM_JSON_LOGS:false}
sugam.observability.slow-query-warn-ms=${SUGAM_SLOW_QUERY_WARN_MS:1000}
sugam.observability.slow-query-error-ms=${SUGAM_SLOW_QUERY_ERROR_MS:3000}
sugam.observability.payload-logging=false
